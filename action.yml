name: mr boxington
description: Set up mbx with local storage, GitHub Actions cache, or a remote cache server or bucket
author: jdx

branding:
  icon: archive
  color: orange

inputs:
  backend:
    description: Cache backend, either "local", "github", or "remote" ("server" is an alias for "remote")
    default: github
  version:
    description: mbx release version to install, such as "0.4.0", or "latest"; when omitted, use mbx from PATH or install latest
    required: false
  mbx-path:
    description: Absolute path to a verified preinstalled mbx executable; requires expected-version and expected-binary-sha256; never downloads mbx
    required: false
  expected-version:
    description: Exact version required from mbx-path; cannot be combined with version
    required: false
  expected-binary-sha256:
    description: Mandatory lowercase SHA-256 of mbx-path from the caller's source-bound platform descriptor; checked before any execution
    required: false
  comparison-state:
    description: Fresh absolute owner comparison-state path inside RUNNER_TEMP; requires strict preinstalled mbx and GitHub objects mode; only protected default-branch pushes may save useful semantic snapshots
    required: false
  github-token:
    description: GitHub token used to resolve mbx release metadata
    default: ${{ github.token }}
  cache-key:
    description: Primary GitHub cache key; comparison mode requires a stable caller-supplied comma-free compatibility identity up to 447 characters and appends the native semantic snapshot digest when saving
    required: false
  cache-key-suffix:
    description: Safe suffix appended to the generated primary key; cannot be used with cache-key
    required: false
  restore-keys:
    description: Newline-separated GitHub restore prefixes; comparison-state requires at most nine caller-supplied ordered source-bound prefixes
    required: false
  cache-generation:
    description: Value included in generated GitHub cache keys; change it to start fresh
    default: v1
  github-cache-mode:
    description: GitHub cache payload, either the warm Cargo "target" tree or portable mbx "objects"
    default: target
  isolate-objects-cache:
    description: Use a private RUNNER_TEMP mbx store and bundle for GitHub objects caching; intended for disposable hosted runners
    default: "false"
  toolchain:
    description: Rust toolchain the build names on its own command line, such as "1.91"; the generated cache key follows it instead of the default rustc
    required: false
  working-directory:
    description: Cargo workspace directory, relative to the job's working directory; the "target" payload caches its target tree and prunes it against that workspace
    default: .
  cache-links:
    description: Cache native links; "auto" enables this on Linux
    default: auto
  remote-url:
    description: Remote cache URL for the remote backend, either a cache server or an s3:// bucket; when omitted, MBX_REMOTE_URL from an earlier step is kept
    required: false
  server-url:
    description: Alias for remote-url
    required: false
  namespace:
    description: Cache namespace for the remote backend; when omitted, MBX_REMOTE_NAMESPACE from an earlier step is kept
    required: false
  token:
    description: Bearer token for a remote cache server
    required: false
  token-file:
    description: File containing a bearer token for a remote cache server
    required: false
  oidc-audience:
    description: OIDC audience for a remote cache server; the job needs id-token write permission
    required: false
  remote-mode:
    description: Requested remote mode (read-write, read-only, or write-only); when omitted, MBX_REMOTE_MODE from an earlier step is kept, and mbx defaults to read-write
    required: false
  server-mode:
    description: Alias for remote-mode
    required: false

outputs:
  cache-hit:
    description: Whether the exact GitHub cache key was restored
  cache-primary-key:
    description: Primary GitHub cache key used by the action
  cache-save-eligible:
    description: Whether the GitHub backend may attempt a save after a successful job; exact target hits, unchanged comparison snapshots, and empty payloads still skip it
  cache-save-reason:
    description: Why the GitHub backend may or may not save, such as "default-branch push" or "pull_request event"
  mbx-version:
    description: Installed mbx version

runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
  post-if: success()
