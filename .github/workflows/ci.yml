name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Native import and transport-boundary tests use a mocked MBX process.
      # They check the action contract; live discovery, producer provenance,
      # and hosted artifact transport remain separate qualification gates.
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist

  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: mbx
        uses: ./
        env:
          ALL_PROXY: ''
          all_proxy: ''
          FTP_PROXY: ''
          ftp_proxy: ''
          HTTP_PROXY: ''
          http_proxy: ''
          HTTPS_PROXY: ''
          https_proxy: ''
          NO_PROXY: ''
          no_proxy: ''
          GLOBAL_AGENT_HTTP_PROXY: ''
          NPM_CONFIG_HTTPS_PROXY: ''
          NPM_CONFIG_PROXY: ''
          npm_config_https_proxy: ''
          npm_config_proxy: ''
          CURL_CA_BUNDLE: ''
          REQUESTS_CA_BUNDLE: ''
          SSL_CERT_FILE: ''
          SSL_CERT_DIR: ''
          NODE_TLS_REJECT_UNAUTHORIZED: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          NODE_USE_SYSTEM_CA: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          OPENSSL_CONF: ''
          OPENSSL_MODULES: ''
          SSLKEYLOGFILE: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          LD_DEBUG: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          BASH_ENV: ''
          ENV: ''
          TAR_OPTIONS: ''
        with:
          backend: local
          snapshot-read-token: ''
      - run: mbx --version
      - run: mbx cache dir
      - name: Check local setup output and native cold state
        env:
          IMPORTED: ${{ steps.mbx.outputs.native-snapshot-imported }}
          COMPARISON_STATE: ${{ steps.mbx.outputs.native-snapshot-comparison-state }}
          MBX_VERSION: ${{ steps.mbx.outputs.mbx-version }}
        run: |
          node -e "if (process.env.IMPORTED !== 'false' || process.env.COMPARISON_STATE !== '' || !process.env.MBX_VERSION) { console.error('unexpected local setup outputs'); process.exit(1) }"
      - name: Check native link cache policy
        run: node -e "if ((process.platform === 'linux') !== (process.env.MBX_CACHE_LINKS === '1')) process.exit(1)"
      - name: Build fixture through the selected MBX
        run: mbx build --locked --manifest-path .github/e2e/fixture/Cargo.toml
      - name: Check workspace target was produced
        run: node -e "const fs = require('node:fs'); if (!fs.existsSync('.github/e2e/fixture/target/debug/.fingerprint')) { console.error('no fingerprint tree in the fixture workspace target'); process.exit(1) }"

  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Configuration is exported for later build commands. No cache operation
      # runs here, so the placeholder endpoint and credentials stay unused.
      - id: mbx
        uses: ./
        env:
          ALL_PROXY: ''
          all_proxy: ''
          FTP_PROXY: ''
          ftp_proxy: ''
          HTTP_PROXY: ''
          http_proxy: ''
          HTTPS_PROXY: ''
          https_proxy: ''
          NO_PROXY: ''
          no_proxy: ''
          GLOBAL_AGENT_HTTP_PROXY: ''
          NPM_CONFIG_HTTPS_PROXY: ''
          NPM_CONFIG_PROXY: ''
          npm_config_https_proxy: ''
          npm_config_proxy: ''
          CURL_CA_BUNDLE: ''
          REQUESTS_CA_BUNDLE: ''
          SSL_CERT_FILE: ''
          SSL_CERT_DIR: ''
          NODE_TLS_REJECT_UNAUTHORIZED: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          NODE_USE_SYSTEM_CA: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          OPENSSL_CONF: ''
          OPENSSL_MODULES: ''
          SSLKEYLOGFILE: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          LD_DEBUG: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          BASH_ENV: ''
          ENV: ''
          TAR_OPTIONS: ''
        with:
          backend: remote
          remote-url: https://cache.example.com
          namespace: action/smoke-test
          token: smoke-test-token
          remote-mode: read-only
          snapshot-read-token: ''
      - name: Check exported remote configuration
        run: |
          node -e "const e=process.env; if(e.MBX_REMOTE_URL!=='https://cache.example.com'||e.MBX_REMOTE_NAMESPACE!=='action/smoke-test'||e.MBX_REMOTE_TOKEN!=='smoke-test-token'||e.MBX_REMOTE_MODE!=='read-only'){console.error('remote action inputs were not exported');process.exit(1)}"
          mbx --version

  remote-inherited:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure remote values in an earlier step
        run: |
          {
            echo MBX_REMOTE_URL=s3://smoke-test/cache/mbx
            echo MBX_REMOTE_NAMESPACE=from-environment
            echo MBX_REMOTE_MODE=read-only
            echo AWS_ACCESS_KEY_ID=placeholder
            echo AWS_SECRET_ACCESS_KEY=placeholder
          } >> "$GITHUB_ENV"
      - id: mbx
        uses: ./
        env:
          ALL_PROXY: ''
          all_proxy: ''
          FTP_PROXY: ''
          ftp_proxy: ''
          HTTP_PROXY: ''
          http_proxy: ''
          HTTPS_PROXY: ''
          https_proxy: ''
          NO_PROXY: ''
          no_proxy: ''
          GLOBAL_AGENT_HTTP_PROXY: ''
          NPM_CONFIG_HTTPS_PROXY: ''
          NPM_CONFIG_PROXY: ''
          npm_config_https_proxy: ''
          npm_config_proxy: ''
          CURL_CA_BUNDLE: ''
          REQUESTS_CA_BUNDLE: ''
          SSL_CERT_FILE: ''
          SSL_CERT_DIR: ''
          NODE_TLS_REJECT_UNAUTHORIZED: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          NODE_USE_SYSTEM_CA: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          OPENSSL_CONF: ''
          OPENSSL_MODULES: ''
          SSLKEYLOGFILE: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          LD_DEBUG: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          BASH_ENV: ''
          ENV: ''
          TAR_OPTIONS: ''
        with:
          backend: remote
          namespace: from-input
          snapshot-read-token: ''
      - name: Check earlier remote settings remain available
        run: |
          node -e "const e=process.env; if(e.MBX_REMOTE_URL!=='s3://smoke-test/cache/mbx'||e.MBX_REMOTE_NAMESPACE!=='from-input'||e.MBX_REMOTE_MODE!=='read-only'||e.AWS_ACCESS_KEY_ID!=='placeholder'||e.AWS_SECRET_ACCESS_KEY!=='placeholder'){console.error('inherited remote settings were not preserved');process.exit(1)}"
          mbx --version

  remote-empty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Remote setup accepts settings supplied later or by MBX configuration;
      # it does not require this setup step to invent remote credentials.
      - id: mbx
        uses: ./
        env:
          ALL_PROXY: ''
          all_proxy: ''
          FTP_PROXY: ''
          ftp_proxy: ''
          HTTP_PROXY: ''
          http_proxy: ''
          HTTPS_PROXY: ''
          https_proxy: ''
          NO_PROXY: ''
          no_proxy: ''
          GLOBAL_AGENT_HTTP_PROXY: ''
          NPM_CONFIG_HTTPS_PROXY: ''
          NPM_CONFIG_PROXY: ''
          npm_config_https_proxy: ''
          npm_config_proxy: ''
          CURL_CA_BUNDLE: ''
          REQUESTS_CA_BUNDLE: ''
          SSL_CERT_FILE: ''
          SSL_CERT_DIR: ''
          NODE_TLS_REJECT_UNAUTHORIZED: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          NODE_USE_SYSTEM_CA: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          OPENSSL_CONF: ''
          OPENSSL_MODULES: ''
          SSLKEYLOGFILE: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          LD_DEBUG: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          BASH_ENV: ''
          ENV: ''
          TAR_OPTIONS: ''
        with:
          backend: remote
          snapshot-read-token: ''
      - run: mbx --version

  native-requires-source-bound-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: native
        continue-on-error: true
        uses: ./
        env:
          ALL_PROXY: ''
          all_proxy: ''
          FTP_PROXY: ''
          ftp_proxy: ''
          HTTP_PROXY: ''
          http_proxy: ''
          HTTPS_PROXY: ''
          https_proxy: ''
          NO_PROXY: ''
          no_proxy: ''
          GLOBAL_AGENT_HTTP_PROXY: ''
          NPM_CONFIG_HTTPS_PROXY: ''
          NPM_CONFIG_PROXY: ''
          npm_config_https_proxy: ''
          npm_config_proxy: ''
          CURL_CA_BUNDLE: ''
          REQUESTS_CA_BUNDLE: ''
          SSL_CERT_FILE: ''
          SSL_CERT_DIR: ''
          NODE_TLS_REJECT_UNAUTHORIZED: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          NODE_USE_SYSTEM_CA: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          OPENSSL_CONF: ''
          OPENSSL_MODULES: ''
          SSLKEYLOGFILE: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          LD_DEBUG: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          BASH_ENV: ''
          ENV: ''
          TAR_OPTIONS: ''
        with:
          backend: local
          snapshot-selection: latest-compatible
          snapshot-read-token: ''
      - name: Require the strict preinstalled binary tuple before native import
        env:
          OUTCOME: ${{ steps.native.outcome }}
        run: |
          node -e "if (process.env.OUTCOME !== 'failure') { console.error('native selection without a source-bound binary must fail'); process.exit(1) }"

  legacy-backend-rejected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: rejected
        continue-on-error: true
        uses: ./
        env:
          ALL_PROXY: ''
          all_proxy: ''
          FTP_PROXY: ''
          ftp_proxy: ''
          HTTP_PROXY: ''
          http_proxy: ''
          HTTPS_PROXY: ''
          https_proxy: ''
          NO_PROXY: ''
          no_proxy: ''
          GLOBAL_AGENT_HTTP_PROXY: ''
          NPM_CONFIG_HTTPS_PROXY: ''
          NPM_CONFIG_PROXY: ''
          npm_config_https_proxy: ''
          npm_config_proxy: ''
          CURL_CA_BUNDLE: ''
          REQUESTS_CA_BUNDLE: ''
          SSL_CERT_FILE: ''
          SSL_CERT_DIR: ''
          NODE_TLS_REJECT_UNAUTHORIZED: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_ENV_PROXY: ''
          NODE_USE_SYSTEM_CA: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          OPENSSL_CONF: ''
          OPENSSL_MODULES: ''
          SSLKEYLOGFILE: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          LD_DEBUG: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          BASH_ENV: ''
          ENV: ''
          TAR_OPTIONS: ''
        with:
          backend: server
          snapshot-read-token: ''
      - name: Check removed backend alias is rejected
        env:
          OUTCOME: ${{ steps.rejected.outcome }}
        run: |
          node -e "if (process.env.OUTCOME !== 'failure') { console.error('removed backend alias must fail'); process.exit(1) }"

  final:
    permissions: {}
    needs: [action, legacy-backend-rejected, native-requires-source-bound-binary, remote, remote-empty, remote-inherited, test]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: ${{ !cancelled() }}
    steps:
      - name: Check CI job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs completed successfully"
