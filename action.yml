name: mr boxington
description: Set up mbx with local storage, an authenticated native snapshot, or a remote cache
author: jdx

branding:
  icon: archive
  color: orange

inputs:
  backend:
    description: MBX backend used by later build steps, either "local" or "remote"
    default: local
  version:
    description: Exact mbx release version to install, such as "1.21.1", or "latest"; omitted uses mbx from PATH or installs latest
    required: false
  mbx-path:
    description: Absolute path to a verified preinstalled mbx executable; requires expected-version and expected-binary-sha256
    required: false
  expected-version:
    description: Exact version required from mbx-path; cannot be combined with version
    required: false
  expected-binary-sha256:
    description: Mandatory lowercase SHA-256 of mbx-path from the caller's source-bound platform descriptor
    required: false
  snapshot-selection:
    description: Native snapshot lookup selection: none, latest-compatible, or artifact-id; selection never grants import authority
    default: none
    required: false
  snapshot-artifact-id:
    description: Untrusted GitHub artifact service ID selector used only with snapshot-selection artifact-id
    required: false
  snapshot-read-token:
    description: Token with actions:read, attestations:read, and contents:read for verified native snapshot import; never passed to ordinary tool children
    default: ${{ github.token }}
    required: false
  comparison-state:
    description: Fresh absolute owner comparison-state path inside RUNNER_TEMP; requires a verified preinstalled MBX binary
    required: false
  cache-links:
    description: Cache native links; "auto" enables this on Linux
    default: auto
  remote-url:
    description: Remote cache URL for the remote backend; when omitted, an earlier MBX_REMOTE_URL or MBX configuration is kept
    required: false
  namespace:
    description: Remote cache namespace; when omitted, an earlier MBX_REMOTE_NAMESPACE or MBX configuration is kept
    required: false
  token:
    description: Bearer token for a remote cache server
    required: false
  token-file:
    description: File containing a bearer token for a remote cache server
    required: false
  oidc-audience:
    description: OIDC audience for a remote cache server; later MBX build commands need id-token write permission
    required: false
  remote-mode:
    description: Requested remote mode (read-write, read-only, or write-only); when omitted, MBX keeps its configured mode
    required: false

outputs:
  native-snapshot-imported:
    description: Whether MBX reports authenticated workspace restoration
  mbx-version:
    description: Selected or installed mbx version

runs:
  using: node24
  main: dist/index.js
